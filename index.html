<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .container{
      max-width:500px;
      padding:20px;
    }

    h1{
      font-size:3rem;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    p{
      color:#bdbdbd;
      margin-bottom:40px;
      font-size:18px;
    }

    .btn{
      background:white;
      color:black;
      padding:15px 35px;
      border-radius:50px;
      text-decoration:none;
      font-weight:bold;
      transition:.3s;
      display:inline-block;
    }

    .btn:hover{
      transform:scale(1.05);

    footer{
      position:absolute;
      bottom:20px;
      width:100%;
      text-align:center;
      color:#777;
      font-size:14px;
